<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Painel de Tarefas - SENAI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="painel">
        <div class="card-extra atrasadas" id="card-atrasadas">
            <div class="titulo-extra">
                <img src="negativo.png" alt="Gatinho triste">
                <h2>Atrasadas</h2>
            </div>
            <ul id="lista-atrasadas" class="lista-tarefas">
            </ul>
        </div>
        <div class="cartao-aplicacao">
            <header class="cabecalho-aplicacao">

                <div class="titulo-com-foto">
                    <img src="elooo.png" alt="Minha foto">
                    <h1>Minhas Tarefas ✨</h1>
                </div>
                <button id="botao-alternar-tema" class="botao-icone">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </header>
            <div class="caixa-entrada">
                <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
                <input type="datetime-local" id="campo-prazo">
                <button id="botao-adicionar" class="botao-principal">
                    <i class="fa-solid fa-plus"></i>Adicionar
                </button>
            </div>
            <ul id="lista-tarefas" class="lista-tarefas">

                <!-- As tarefas serão inseridas aqui pelo JavaScript -->
            </ul>
            <footer class="rodape-aplicacao">
                <span id="contador-tarefas">
                    0 tarefas na lista
                </span>
            </footer>
        </div>
        <div class="card-extra concluidas" id="card-concluidas">
            <div class="titulo-extra">
                <img src="positivo.png" alt="Gatinho feliz">
                <h2>Concluídas</h2>
            </div>
            <ul id="lista-concluidas" class="lista-tarefas">
            </ul>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
